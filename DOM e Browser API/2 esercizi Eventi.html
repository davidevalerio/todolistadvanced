<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi Eventi</title>
    <script src="2-esercizi-eventi.js" defer></script>
</head>
<body>

    <h1>Esercizio 1</h1>
    <button id="mioPulsante">Premi Qua</button>

    <h1>Esercizio 2</h1>
    <form id="form">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <button id="pulsanteSubmit" type="submit">Invia Modulo</button>
    </form>

    <h1>Esercizio 3</h1>
    <input id="mioInput">

    <h1>Esercizio 4</h1>

    <p>Caricamento completo!</p>

    <h1>Esercizio 5</h1>

    <div id="passaSopra">
        <p>Passami sopra</p>
    </div>

    <h1>Esercizio 6</h1>

    <div>
        <input id="inputtone">
    </div>

    <h1>Esercizio 7</h1>

    <label for="auto">Scegli una macchina:</label>

    <select id="mioSelect" name="auto">
        <option value="fiat">Fiat</option>
        <option value="ferrari">Ferrari</option>
        <option value="lancia">Lancia</option>
        <option value="alfa">Alfa Romeo</option>
    </select>

    <h1>Esercizio 8</h1>
    <input id="inputKeyboard"> 

    <h1>Esercizio 10</h1>
    <button id="button">DOPPIO CLICK</button>

    <h1>Esercizio 11</h1>
    <input type="range" id="mioRange">

    <h1>Esercizio 12</h1>
    <div id="divvone">
        <p>Muovi il mouse fuori da qua</p>
    </div>

    <h1>Esercizio 13</h1>
    <div id="div-test">
        <p>Premi il tasto destro del mouse</p>
    </div>
</body>
</html>
